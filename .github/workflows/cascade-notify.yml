name: Cascade notify

# Reusable: an upstream repo calls this after its release is published, and
# it sends repository_dispatch `upstream-released` to each downstream
# receiver (workspace RELEASING.md, section "Notify after publish"). The
# source is always the calling repo; the targets are the fixed map in
# .github/scripts/cascade/wiring/lib.sh. Callers pass no secrets: the App
# key is the caller repo's `cascade` Environment secret.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag that was just published
        type: string
        required: true
      org-github-ref:
        description: The .github ref the scripts come from; only a sandbox repo may pass another than main
        type: string
        required: false
        default: main

permissions: {}

jobs:
  notify:
    name: Notify downstream
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Runs before anything is checked out from org-github-ref, so the ref
      # it guards cannot replace it.
      - name: Guard
        id: guard
        env:
          INPUTS_REF: ${{ inputs.org-github-ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          if [ "$owner/$name" != "$GITHUB_REPOSITORY" ] || [ "$owner" != open-platform-model ] \
            || ! [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::\`$GITHUB_REPOSITORY\` is not a repo of open-platform-model"
            exit 1
          fi
          if [ "$INPUTS_REF" != main ] && [[ ! $GITHUB_REPOSITORY =~ ^open-platform-model/cascade-sandbox- ]]; then
            echo "::error::org-github-ref may differ from main only in a sandbox repo"
            exit 1
          fi
          echo "::notice::repo $name"
          echo "repo=$name" >>"$GITHUB_OUTPUT"

      - name: Check out org .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/.github
          ref: ${{ inputs.org-github-ref }}
          path: org-github
          persist-credentials: false

      - name: Validate
        id: validate
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          targets=$(bash org-github/.github/scripts/cascade/wiring/notify.sh validate --tag "$TAG")
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

      - name: Wait for the Go proxy
        if: steps.guard.outputs.repo == 'library'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          TAG: ${{ inputs.tag }}
        run: bash org-github/.github/scripts/cascade/wiring/notify.sh wait-proxy --tag "$TAG"

      # An owner without repositories would mint a token for every repo the
      # App is installed on.
      - name: Check the token scope
        env:
          TARGETS: ${{ steps.validate.outputs.targets }}
        run: |
          set -euo pipefail
          if [ -z "$TARGETS" ]; then
            echo "::error::the repository list is empty; refusing to mint"
            exit 1
          fi

      - name: Mint the App token
        id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
          owner: open-platform-model
          repositories: ${{ steps.validate.outputs.targets }}
          permission-contents: write

      - name: Dispatch
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: bash org-github/.github/scripts/cascade/wiring/notify.sh dispatch --tag "$TAG"
