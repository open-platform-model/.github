name: mention-guard

# Org-wide PR gate. Required across all open-platform-model repos via an
# organization ruleset ("Require workflows to pass before merging").
#
# Scans the PR title, PR body, and every branch commit message for text that
# becomes permanent and outward-facing once merged:
#
#   1. Bare @mentions (`@v1`, `->@v1`, `"@v1"`) — GitHub pings the named user.
#      The squash commit carries the PR title (or, under GitHub's default
#      COMMIT_OR_PR_TITLE, a one-commit PR's subject) and, in repos that
#      squash with squash_merge_commit_message: COMMIT_MESSAGES, the branch
#      commit messages.
#      The release repos (core, catalog_opm, library, opm-operator, cli, opm)
#      move to BLANK, title only, once the owner applies workspace RELEASING.md
#      "Owner settings"; until then they squash with COMMIT_MESSAGES too.
#      release-please copies commit text into changelogs and GitHub release
#      notes, which re-render mentions. Commit messages are not Markdown:
#      backticks do NOT protect.
#   2. Session identifiers (`Claude-Session:`, claude.ai/code/session URLs).
#   3. AI generated-with footers ("Generated with Claude Code" etc.).
#   4. AI co-author trailers in any form other than exactly
#      `Co-Authored-By: Claude <noreply@anthropic.com>` (the one allowed form —
#      no model or version names, no links). Human co-authors are untouched.
#
# Two exceptions keep bot PRs mergeable (see BOT_HANDLES and BODY_IS_ADVISORY
# below): automation handles are not strangers, and a generated PR body that
# nobody can reword must not be able to block a merge.
#
# Break-glass: org admins are on the ruleset bypass list.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mention-guard-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: mention-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan PR title, body and commit messages
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            // A bare mention: @ followed by alnum, not glued to a preceding
            // word character (core@v2, emails) and not part of @@ diff hunks.
            const MENTION = /(?<![\w@])@[A-Za-z0-9][A-Za-z0-9-]*/g;
            const SESSION = /(claude-session\s*:|claude\.ai\/code\/session)/i;
            const GENERATED = /generated\s+with/i;
            const AI_NAME = /\b(claude|anthropic|copilot|openai|chatgpt|gpt-?[0-9o]|gemini|codex|aider|devin|cursor|windsurf)\b/i;
            const PLAIN_TRAILER = 'co-authored-by: claude <noreply@anthropic.com>';

            // Exception 1 — automation accounts you address BY NAME to drive
            // them: `@dependabot rebase`, `@renovate recreate`. Every Dependabot
            // PR body ends with that command list, so the guard used to fail
            // every dependency bump in the org. The rule exists to stop an
            // uninvolved stranger being pinged and left with a permanent
            // backlink on their profile; these are bots already subscribed to
            // the thread, and the handle has to stay literal or the documented
            // command stops working. Exact-match only: @dependabotx still fails.
            const BOT_HANDLES = new Set([
              'dependabot',
              'dependabot-preview',
              'renovate',
              'renovate-bot',
              'github-actions',
            ]);

            const findings = [];
            const scan = (surface, text, { advisory = false } = {}) => {
              (text ?? '').split(/\r?\n/).forEach((raw, idx) => {
                const line = raw.trim();
                const loc = `${surface}, line ${idx + 1}`;
                const flag = (why) => findings.push({ loc, line, why, advisory });
                for (const m of raw.matchAll(MENTION)) {
                  if (BOT_HANDLES.has(m[0].slice(1).toLowerCase())) continue;
                  flag(`bare mention "${m[0]}" pings the GitHub user "${m[0].slice(1)}" — glue the @ to a word character (core@v2) or drop it; backticks do not protect commit messages`);
                }
                if (SESSION.test(raw)) {
                  flag('session identifier — never allowed in commits, PR text, issues or releases');
                }
                if (GENERATED.test(raw) && (AI_NAME.test(raw) || raw.includes('\u{1F916}'))) {
                  flag('AI generated-with footer — never allowed');
                }
                const t = line.toLowerCase();
                if (t.startsWith('co-authored-by:') && AI_NAME.test(raw) && t !== PLAIN_TRAILER) {
                  flag('AI co-author trailer must be exactly "Co-Authored-By: Claude <noreply@anthropic.com>" — no model or version names, no links');
                }
              });
            };

            const pr = context.payload.pull_request;

            // Exception 2 — a bot-authored PR body is generated boilerplate. No
            // maintainer can reword it (Dependabot rewrites it on every rebase
            // or recreate), and no repo in this org puts the body into the
            // squash commit (repos squash with COMMIT_MESSAGES or, in the
            // release repos, BLANK; neither includes the PR body), so it never
            // reaches permanent history. A finding there is reported, not
            // blocking — otherwise the only way to merge is admin bypass.
            // The title, which lands in history (except in a one-commit PR
            // under COMMIT_OR_PR_TITLE, where the commit subject does), and
            // the commit messages, which DO land in history in repos that
            // squash with COMMIT_MESSAGES, stay hard failures for bots and
            // humans alike.
            const authorIsBot =
              pr.user?.type === 'Bot' || /\[bot\]$/.test(pr.user?.login ?? '');

            scan('PR title', pr.title);
            scan('PR body', pr.body, { advisory: authorIsBot });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            for (const c of commits) scan(`commit ${c.sha.slice(0, 7)}`, c.commit.message);

            if (findings.length === 0) {
              core.info('mention-guard: clean');
              return;
            }

            const blocking = findings.filter((f) => !f.advisory);
            const advisory = findings.filter((f) => f.advisory);
            const render = (list) => {
              for (const f of list) {
                core.summary.addRaw(`- **${f.loc}** — ${f.why}\n\n  > ${f.line}\n`);
              }
            };

            if (blocking.length > 0) {
              core.summary.addHeading('mention-guard: violations found', 2);
              core.summary.addRaw('\nThese strings become permanent once merged: the PR title and, in repos squashing with COMMIT_MESSAGES, the branch commit messages become the squash commit; release-please copies it into release notes.\n\n');
              render(blocking);
              core.summary.addRaw('\n**Fix:** edit the PR title in the web UI; rewrite commit messages with `git commit --amend` or `git rebase -i` and force-push the branch.\n');
            }
            if (advisory.length > 0) {
              core.summary.addHeading('mention-guard: advisory (bot-authored PR body)', 2);
              core.summary.addRaw('\nThe body of a bot PR is generated and never enters the squash commit, so these do not block the merge. Nothing to do unless the bot template itself is wrong.\n\n');
              render(advisory);
            }
            await core.summary.write();

            for (const f of advisory) core.notice(`${f.loc}: ${f.why} | ${f.line}`);
            for (const f of blocking) core.error(`${f.loc}: ${f.why} | ${f.line}`);

            if (blocking.length > 0) {
              core.setFailed(`mention-guard: ${blocking.length} violation(s) — see the job summary for details`);
            } else {
              core.info(`mention-guard: ${advisory.length} advisory finding(s) in a bot-authored PR body — not blocking`);
            }
