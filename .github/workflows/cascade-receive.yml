name: Cascade receive

# Reusable: each receiving repo's deps-cascade.yml calls this on
# repository_dispatch `upstream-released`, on its schedule and by hand
# (workspace RELEASING.md, section "The receiver"). Three jobs:
#   compute  runs the repo's `task -x deps:cascade` on the rolling
#            deps/cascade branch and plans the result; it runs repo code,
#            so it holds no secret and only read permissions
#   gates    posts G2 cascade/freshness and G3 cascade/settled on open
#            release PRs with GITHUB_TOKEN
#   publish  verifies the plan, then mints the App token (cascade
#            Environment) and pushes under a lease, opens, edits, recreates,
#            closes or labels the PR; it never runs repo code
# Callers pass no secrets: the App key is the caller repo's `cascade`
# Environment secret.

on:
  workflow_call:
    inputs:
      dry-run:
        description: Compute and summarize only; publish never runs (the caller passes true unless CASCADE_DRY_RUN is exactly false)
        type: boolean
        required: true
      gates-only:
        description: Evaluate and post the release-PR gates, then stop
        type: boolean
        required: false
        default: false
      g2-mode:
        description: cascade/freshness mode, warn or enforce
        type: string
        required: false
        default: warn
      g3-mode:
        description: cascade/settled mode, warn or enforce
        type: string
        required: false
        default: warn
      setup-go:
        description: Install Go from repo/go.mod
        type: boolean
        required: false
        default: false
      setup-cue:
        description: Install CUE
        type: boolean
        required: false
        default: true
      cue-version:
        description: The CUE version setup-cue installs
        type: string
        required: false
        default: v0.17.1
      labels-managed:
        description: The repo declares its labels itself (cli); publish only checks they exist
        type: boolean
        required: false
        default: false
      org-github-ref:
        description: The .github ref the scripts come from; only a sandbox repo may pass another than main
        type: string
        required: false
        default: main

permissions: {}

jobs:
  compute:
    name: Compute
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      dry_run: ${{ steps.init.outputs.dry_run }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      # Runs before anything is checked out from org-github-ref, so the ref
      # it guards cannot replace it.
      - name: Guard
        id: guard
        env:
          INPUTS_REF: ${{ inputs.org-github-ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          if [ "$owner/$name" != "$GITHUB_REPOSITORY" ] || [ "$owner" != open-platform-model ] \
            || ! [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::\`$GITHUB_REPOSITORY\` is not a repo of open-platform-model"
            exit 1
          fi
          if [ "$INPUTS_REF" != main ] && [[ ! $GITHUB_REPOSITORY =~ ^open-platform-model/cascade-sandbox- ]]; then
            echo "::error::org-github-ref may differ from main only in a sandbox repo"
            exit 1
          fi
          echo "::notice::repo $name"
          echo "repo=$name" >>"$GITHUB_OUTPUT"

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Check out org .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/.github
          ref: ${{ inputs.org-github-ref }}
          path: org-github
          persist-credentials: false

      - name: Set up Go
        if: inputs.setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: repo/go.mod

      - name: Set up CUE
        if: inputs.setup-cue
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: ${{ inputs.cue-version }}

      - name: Set up Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      - name: Init
        id: init
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_DRY_RUN: ${{ inputs.dry-run }}
          CASCADE_GATES_ONLY: ${{ inputs.gates-only }}
          CASCADE_REF: ${{ github.ref }}
          CASCADE_EVENT: ${{ github.event_name }}
          CASCADE_G2_MODE: ${{ inputs.g2-mode }}
          CASCADE_G3_MODE: ${{ inputs.g3-mode }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh init

      # The payload is untrusted: it reaches the script only as data.
      - name: Payload
        id: payload
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_EVENT: ${{ github.event_name }}
          CASCADE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh payload

      - name: PR state
        id: state
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          GH_TOKEN: ${{ github.token }}
          CASCADE_READ_TOKEN: ${{ github.token }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh state

      - name: Prepare the branch
        id: prepare
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh prepare

      - name: Notes
        id: notes
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh notes

      # Runs the repo's task: no token reaches this step.
      - name: Run the task
        id: run
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh run

      - name: Body, title and labels
        id: text
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          GH_TOKEN: ${{ github.token }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh text

      - name: Action
        id: action
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh action

      - name: Plan
        id: plan
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh plan

      - name: Summary
        id: summary
        if: always() && !inputs.gates-only && steps.init.outcome == 'success'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_REF: ${{ github.ref }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh summary

      - name: Upload the plan
        if: always() && !inputs.gates-only && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-plan
          path: |
            ${{ runner.temp }}/cascade/plan.json
            ${{ runner.temp }}/cascade/body.md
            ${{ runner.temp }}/cascade/cascade.bundle
            ${{ runner.temp }}/cascade/diff.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: compute
    # The dry-run input and the ref are read here, not from compute, which
    # runs repo code and so cannot be trusted to hold the stop switch.
    if: >-
      needs.compute.result == 'success'
      && needs.compute.outputs.dry_run != 'true'
      && !inputs.dry-run
      && github.ref == 'refs/heads/main'
      && contains(fromJSON('["push","recreate","close","conflict","too_long"]'), needs.compute.outputs.action)
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Runs before anything is checked out from org-github-ref, so the ref
      # it guards cannot replace it.
      - name: Guard
        id: guard
        env:
          INPUTS_REF: ${{ inputs.org-github-ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          if [ "$owner/$name" != "$GITHUB_REPOSITORY" ] || [ "$owner" != open-platform-model ] \
            || ! [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::\`$GITHUB_REPOSITORY\` is not a repo of open-platform-model"
            exit 1
          fi
          if [ "$INPUTS_REF" != main ] && [[ ! $GITHUB_REPOSITORY =~ ^open-platform-model/cascade-sandbox- ]]; then
            echo "::error::org-github-ref may differ from main only in a sandbox repo"
            exit 1
          fi
          echo "::notice::repo $name"
          echo "repo=$name" >>"$GITHUB_OUTPUT"

      - name: Check out org .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/.github
          ref: ${{ inputs.org-github-ref }}
          path: org-github
          persist-credentials: false

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-plan
          path: ${{ runner.temp }}/cascade/plan

      - name: Verify the plan
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          GH_TOKEN: ${{ github.token }}
          CASCADE_READ_TOKEN: ${{ github.token }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-publish.sh verify

      - name: Mint the App token
        id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
          owner: open-platform-model
          repositories: ${{ steps.guard.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Act
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_LABELS_MANAGED: ${{ inputs.labels-managed }}
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-publish.sh act
