name: Cascade receive

# Reusable: each receiving repo's deps-cascade.yml calls this on
# repository_dispatch `upstream-released`, on its schedule and by hand
# (workspace RELEASING.md, section "The receiver"). Two jobs:
#   compute  runs the repo's `task -x deps:cascade` on the rolling
#            deps/cascade branch and plans the result; it runs repo code,
#            so it holds no secret and only read permissions
#   gates    posts G2 cascade/freshness and G3 cascade/settled on open
#            release PRs with GITHUB_TOKEN
# The third job, publish, is the caller's own: it declares `environment:
# cascade` and runs the composite action .github/actions/cascade-publish,
# because a reusable-workflow job does not see the caller's Environment
# secrets without `secrets: inherit` (sandbox cycle E1). Its if: reads the
# outputs below only as hints: compute ran repo code, so the caller reads
# its own dry_run and gates_only inputs too, and passes gates-only to the
# action, which refuses a gates-only run. Callers pass no secrets to this
# workflow. Callers pin this
# workflow to a .github commit SHA (owner decision 24, extended from the
# actions to the workflows); every job checks the scripts out at that same
# commit (job.workflow_sha).

on:
  workflow_call:
    outputs:
      action:
        description: The planned action (push, recreate, close, conflict, too_long, skip, noop or gates-only; always gates-only on a gates-only run)
        value: ${{ jobs.compute.outputs.action }}
      dry-run:
        description: true when compute planned a dry run (forced off main)
        value: ${{ jobs.compute.outputs.dry_run }}
      compute-ok:
        description: true only when every compute step succeeded and the run is not gates-only
        value: ${{ jobs.compute.outputs.ok }}
    inputs:
      dry-run:
        description: Compute and summarize only; publish never runs (the caller passes true unless CASCADE_DRY_RUN is exactly false)
        type: boolean
        required: true
      gates-only:
        description: Evaluate and post the release-PR gates, then stop
        type: boolean
        required: false
        default: false
      g2-mode:
        description: cascade/freshness mode, warn or enforce
        type: string
        required: false
        default: warn
      g3-mode:
        description: cascade/settled mode, warn or enforce
        type: string
        required: false
        default: warn
      setup-go:
        description: Install Go from repo/go.mod
        type: boolean
        required: false
        default: false
      setup-cue:
        description: Install CUE
        type: boolean
        required: false
        default: true
      cue-version:
        description: The CUE version setup-cue installs
        type: string
        required: false
        default: v0.17.1

permissions: {}

jobs:
  compute:
    name: Compute
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    # A gates-only run's action and ok come from the input, not from a step:
    # the Gates step runs the release heads' code, which could write any
    # output of its own step. dry_run comes from Init, before any repo code.
    outputs:
      action: ${{ inputs.gates-only && 'gates-only' || steps.plan.outputs.action }}
      dry_run: ${{ steps.init.outputs.dry_run }}
      mode: ${{ steps.plan.outputs.mode }}
      ok: ${{ !inputs.gates-only && steps.done.outputs.ok == 'true' && 'true' || 'false' }}
    steps:
      # Derives the repo name the later steps use, from GITHUB_REPOSITORY
      # only, before any script runs.
      - name: Guard
        id: guard
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          if [ "$owner/$name" != "$GITHUB_REPOSITORY" ] || [ "$owner" != open-platform-model ] \
            || ! [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::\`$GITHUB_REPOSITORY\` is not a repo of open-platform-model"
            exit 1
          fi
          echo "::notice::repo $name"
          echo "repo=$name" >>"$GITHUB_OUTPUT"

      # The .github commit this reusable workflow runs at (the caller's
      # pinned SHA): the scripts are checked out at exactly that commit.
      # Never empty: an empty ref would check out the default branch.
      - name: Own commit
        id: own
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ "$WF_REPO" != open-platform-model/.github ] || ! [[ $WF_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot tell the open-platform-model/.github commit this workflow runs at (\`$WF_REPO\` \`$WF_SHA\`)"
            exit 1
          fi
          echo "::notice::scripts from open-platform-model/.github $WF_SHA"
          echo "sha=$WF_SHA" >>"$GITHUB_OUTPUT"

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Check out org .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/.github
          ref: ${{ steps.own.outputs.sha }}
          path: org-github
          persist-credentials: false

      - name: Set up Go
        if: inputs.setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: repo/go.mod

      - name: Set up CUE
        if: inputs.setup-cue
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: ${{ inputs.cue-version }}

      - name: Set up Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      - name: Init
        id: init
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_DRY_RUN: ${{ inputs.dry-run }}
          CASCADE_GATES_ONLY: ${{ inputs.gates-only }}
          CASCADE_REF: ${{ github.ref }}
          CASCADE_EVENT: ${{ github.event_name }}
          CASCADE_G2_MODE: ${{ inputs.g2-mode }}
          CASCADE_G3_MODE: ${{ inputs.g3-mode }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh init

      # The payload is untrusted: it reaches the script only as data.
      - name: Payload
        id: payload
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_EVENT: ${{ github.event_name }}
          CASCADE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh payload

      # Before any pin work, so a later failure still leaves gate results.
      # Runs the release heads' own task: no token reaches that task.
      - name: Gates
        id: gates
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_GATES_ONLY: ${{ inputs.gates-only }}
          GH_TOKEN: ${{ github.token }}
          CASCADE_READ_TOKEN: ${{ github.token }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh gates

      - name: Upload the gate results
        if: always() && steps.init.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-gates
          path: ${{ runner.temp }}/cascade/gates.json
          if-no-files-found: ignore
          retention-days: 1

      - name: PR state
        id: state
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          GH_TOKEN: ${{ github.token }}
          CASCADE_READ_TOKEN: ${{ github.token }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh state

      - name: Prepare the branch
        id: prepare
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh prepare

      - name: Notes
        id: notes
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh notes

      # Runs the repo's task: no token reaches this step.
      - name: Run the task
        id: run
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh run

      - name: Body, title and labels
        id: text
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          GH_TOKEN: ${{ github.token }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh text

      - name: Action
        id: action
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh action

      - name: Plan
        id: plan
        if: '!inputs.gates-only'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh plan

      - name: Summary
        id: summary
        if: always() && !inputs.gates-only && steps.init.outcome == 'success'
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_REF: ${{ github.ref }}
        run: bash org-github/.github/scripts/cascade/wiring/receive-compute.sh summary

      - name: Upload the plan
        if: always() && !inputs.gates-only && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-plan
          path: |
            ${{ runner.temp }}/cascade/plan.json
            ${{ runner.temp }}/cascade/body.md
            ${{ runner.temp }}/cascade/cascade.bundle
            ${{ runner.temp }}/cascade/diff.patch
          if-no-files-found: error
          retention-days: 1

      # Last, so compute-ok is true only when every step above succeeded.
      - name: Done
        id: done
        run: echo "ok=true" >>"$GITHUB_OUTPUT"

  gates:
    name: Post gates
    needs: compute
    # Also in dry runs and gates-only runs: statuses are not pushes.
    if: always() && needs.compute.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      # Derives the repo name the later steps use, from GITHUB_REPOSITORY
      # only, before any script runs.
      - name: Guard
        id: guard
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          if [ "$owner/$name" != "$GITHUB_REPOSITORY" ] || [ "$owner" != open-platform-model ] \
            || ! [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::\`$GITHUB_REPOSITORY\` is not a repo of open-platform-model"
            exit 1
          fi
          echo "::notice::repo $name"
          echo "repo=$name" >>"$GITHUB_OUTPUT"

      # The .github commit this reusable workflow runs at (the caller's
      # pinned SHA): the scripts are checked out at exactly that commit.
      # Never empty: an empty ref would check out the default branch.
      - name: Own commit
        id: own
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ "$WF_REPO" != open-platform-model/.github ] || ! [[ $WF_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot tell the open-platform-model/.github commit this workflow runs at (\`$WF_REPO\` \`$WF_SHA\`)"
            exit 1
          fi
          echo "::notice::scripts from open-platform-model/.github $WF_SHA"
          echo "sha=$WF_SHA" >>"$GITHUB_OUTPUT"

      - name: Check out org .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/.github
          ref: ${{ steps.own.outputs.sha }}
          path: org-github
          persist-credentials: false

      - name: Download the gate results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-gates
          path: ${{ runner.temp }}/cascade/gates

      - name: Post the statuses
        env:
          CASCADE_REPO: ${{ steps.guard.outputs.repo }}
          CASCADE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          G2_MODE: ${{ inputs.g2-mode }}
          G3_MODE: ${{ inputs.g3-mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post=org-github/.github/scripts/cascade/wiring/gates-post.sh
          f="$RUNNER_TEMP/cascade/gates/gates.json"
          if [ -f "$f" ]; then
            bash "$post" --g2-mode "$G2_MODE" --g3-mode "$G3_MODE" "$f"
          else
            bash "$post" --g2-mode "$G2_MODE" --g3-mode "$G3_MODE" --missing
          fi
