name: cut-release-branch

# Reusable workflow: cut a lazy maintenance branch release/<tag_prefix><minor>
# from the newest <tag_prefix><minor>.<patch> release tag, then open a PR into
# that branch that makes release-please on it cut patch releases only.
#
# Caller (in the releasing repo), for example core release/v2.0:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         minor: { description: 'Minor to branch, X.Y', required: true, type: string }
#   jobs:
#     cut:
#       uses: open-platform-model/.github/.github/workflows/cut-release-branch.yml@<sha>
#       with:
#         tag_prefix: v            # catalog_opm: opm-v or k8s-v
#         minor: ${{ inputs.minor }}
#         package_path: .          # catalog_opm: opm or k8s
#         release_app_client_id: ${{ vars.RELEASE_APP_CLIENT_ID }}
#       secrets:
#         release_app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#
# Token: pass either the release App credentials (preferred: the workflow
# mints the App token itself, so CI runs on the setup PR without approval) or
# `token`, a token with contents: write and pull-requests: write on the
# caller repo. A token cannot be handed from another job of the caller, so
# minting happens here.
#
# Refuses when the branch already exists, when no final release of that minor
# exists (prereleases are ignored), or when the release-please package or the
# release-please step cannot be found. Never touches tags.

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: Tag prefix before the version, for example v or opm-v
        type: string
        default: v
      minor:
        description: Minor version to branch, X.Y (for example 2.0)
        type: string
        required: true
      package_path:
        description: Package key in release-please-config.json
        type: string
        default: .
      release_workflow:
        description: Caller workflow that runs release-please on push
        type: string
        default: .github/workflows/release.yml
      release_app_client_id:
        description: Client id of the release App; set together with release_app_private_key
        type: string
        default: ''
    secrets:
      release_app_private_key:
        required: false
      token:
        required: false

permissions: {}

jobs:
  cut:
    name: cut release/${{ inputs.tag_prefix }}${{ inputs.minor }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {} # every write goes through the passed or minted token
    env:
      TAG_PREFIX: ${{ inputs.tag_prefix }}
      MINOR: ${{ inputs.minor }}
      PACKAGE_PATH: ${{ inputs.package_path }}
      RELEASE_WORKFLOW: ${{ inputs.release_workflow }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::bad tag_prefix: $TAG_PREFIX"; exit 1; }
          [[ "$MINOR" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::minor must be X.Y, got: $MINOR"; exit 1; }
          [[ -n "$PACKAGE_PATH" && "$PACKAGE_PATH" != *$'\n'* ]] || { echo "::error::bad package_path"; exit 1; }
          [[ "$RELEASE_WORKFLOW" =~ ^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$ ]] || { echo "::error::bad release_workflow: $RELEASE_WORKFLOW"; exit 1; }
          echo "BRANCH=release/${TAG_PREFIX}${MINOR}" >>"$GITHUB_ENV"
          echo "SETUP_BRANCH=release-setup/${TAG_PREFIX}${MINOR}" >>"$GITHUB_ENV"

      - name: Mint the release App token
        id: app-token
        if: inputs.release_app_client_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.release_app_client_id }}
          private-key: ${{ secrets.release_app_private_key }}

      - name: Select the token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PASSED_TOKEN: ${{ secrets.token }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_TOKEN" && -z "$PASSED_TOKEN" ]]; then
            echo '::error::pass release_app_client_id + release_app_private_key, or token'
            exit 1
          fi

      - name: Check out the caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.token }}
          fetch-depth: 1

      - name: Find the newest release of the minor
        id: tag
        run: |
          set -euo pipefail
          # Only final releases <prefix>X.Y.<patch>; prereleases (-beta.N) and
          # anything else under the prefix are ignored.
          refs=$(git ls-remote --tags origin "refs/tags/${TAG_PREFIX}${MINOR}.*")
          tag=$(awk -v p="refs/tags/${TAG_PREFIX}${MINOR}." '
              index($2, p) == 1 {
                patch = substr($2, length(p) + 1)
                if (patch ~ /^(0|[1-9][0-9]*)$/) print patch "\t" substr($2, 11)
              }' <<<"$refs" | sort -n -k1,1 | tail -n1 | cut -f2)
          if [[ -z "$tag" ]]; then
            echo "::error::no final release tag ${TAG_PREFIX}${MINOR}.<patch> exists"
            exit 1
          fi
          # Annotated tags list the commit on a second "^{}" line.
          sha=$(awk -v r="refs/tags/$tag^{}" '$2 == r {print $1}' <<<"$refs")
          [[ -n "$sha" ]] || sha=$(awk -v r="refs/tags/$tag" '$2 == r {print $1}' <<<"$refs")
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "newest ${TAG_PREFIX}${MINOR} release: $tag at $sha"

      - name: Refuse an existing branch
        run: |
          set -euo pipefail
          for b in "$BRANCH" "$SETUP_BRANCH"; do
            rc=0
            git ls-remote --exit-code --heads origin "refs/heads/$b" >/dev/null || rc=$?
            case "$rc" in
              0) echo "::error::$b already exists; a release branch is cut once and never re-cut"; exit 1 ;;
              2) ;;
              *) echo "::error::git ls-remote failed with exit code $rc"; exit 1 ;;
            esac
          done

      - name: Prepare the release-please settings for the branch
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "refs/tags/$TAG"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$TAG_SHA" ]] ||
            { echo "::error::$TAG no longer points at $TAG_SHA"; exit 1; }
          git checkout -q -b "$SETUP_BRANCH" "$TAG_SHA"

          # Semantic equality, key order ignored.
          same_json() { cmp -s <(jq -S . "$1" 2>/dev/null) <(jq -S . "$2" 2>/dev/null); }
          same_yaml() { cmp -s <(yq -o=json -I0 'sort_keys(..)' "$1" 2>/dev/null) <(yq -o=json -I0 'sort_keys(..)' "$2" 2>/dev/null); }

          # 1. Patch releases only, final versions only. A stray feat on the
          #    branch must not claim a minor that main needs. In a multi-package
          #    repo (catalog_opm) the branch belongs to one package: the other
          #    packages are dropped from the branch config so release-please
          #    on it cannot release them.
          cfg=release-please-config.json
          jq -e --arg p "$PACKAGE_PATH" '.packages[$p] | has("versioning") and has("prerelease")' "$cfg" >/dev/null ||
            { echo "::error::$cfg has no package \"$PACKAGE_PATH\" with versioning and prerelease keys"; exit 1; }
          jq --indent 2 --arg p "$PACKAGE_PATH" \
            '.packages |= {($p): (.[$p] | .versioning = "always-bump-patch" | .prerelease = false)}' \
            "$cfg" >"$RUNNER_TEMP/cfg-want.json"
          # Text edit inside the package object keeps the file's layout; the
          # jq result above is the reference and the fallback.
          awk -v key="\"$PACKAGE_PATH\": {" '
            index($0, key) && !inpkg { inpkg = 1; match($0, /^ */); depth = RLENGTH; print; next }
            inpkg && /^ *}/ { match($0, /^ */); if (RLENGTH == depth) inpkg = 0 }
            inpkg { sub(/"versioning": *"[^"]*"/, "\"versioning\": \"always-bump-patch\"")
                    sub(/"prerelease": *(true|false)/, "\"prerelease\": false") }
            { print }
          ' "$cfg" >"$RUNNER_TEMP/cfg-text.json"
          if same_json "$RUNNER_TEMP/cfg-text.json" "$RUNNER_TEMP/cfg-want.json"; then
            cp "$RUNNER_TEMP/cfg-text.json" "$cfg"
          else
            echo "::warning::text edit of $cfg did not match the jq edit; using the jq output"
            cp "$RUNNER_TEMP/cfg-want.json" "$cfg"
          fi

          # 2. The release workflow runs on pushes to release/** and points
          #    release-please at the pushed branch (it defaults to the repo's
          #    default branch). Edited as text to keep the file's layout, then
          #    checked against a yq edit of the same file; on any mismatch the
          #    yq output (correct, but without blank lines) is used.
          wf=$RELEASE_WORKFLOW
          [[ -f "$wf" ]] || { echo "::error::$wf not found"; exit 1; }
          # The expression text, kept out of reach of this step's own
          # expression interpolation.
          export TARGET_EXPR='$''{{ github.ref_name }}'
          want='.on.push.branches |= ((. // []) + (["release/**"] - (. // [])))
            | (.jobs[].steps[] | select((.uses // "") | test("^googleapis/release-please-action@")) | .with."target-branch") = strenv(TARGET_EXPR)'
          n=$(yq '[.jobs[].steps[] | select((.uses // "") | test("^googleapis/release-please-action@"))] | length' "$wf")
          [[ "$n" -ge 1 ]] || { echo "::error::$wf has no googleapis/release-please-action step"; exit 1; }
          yq "$want" "$wf" >"$RUNNER_TEMP/want.yml"
          awk -v target="$TARGET_EXPR" '
            function ind(s) { match(s, /^ */); return RLENGTH }
            # on: > push: > branches: list; append after its last item.
            /^on:/ { inon = 1 }
            inon && /^[^ #]/ && !/^on:/ { inon = 0 }
            inon && /^  push:/ { inpush = 1; print; next }
            inpush && /^  [^ ]/ { inpush = 0 }
            inpush && /^    branches:/ { inbr = 1; print; next }
            inbr && /^      - / { if ($0 ~ /release\/\*\*/) have = 1; print; next }
            inbr { if (!have) print "      - release/**"; inbr = 0; inpush = 0 }
            # with: block of a release-please-action step.
            /uses: *googleapis\/release-please-action@/ { rp = 1; print; next }
            rp && /^ *with: *$/ { print; w = ind($0) + 2; for (i = 0; i < w; i++) pad = pad " "
              print pad "target-branch: " target; pad = ""; rp = 0; next }
            rp && /^ *- / { rp = 0 }
            { print }
          ' "$wf" >"$RUNNER_TEMP/text.yml"
          if same_yaml "$RUNNER_TEMP/text.yml" "$RUNNER_TEMP/want.yml"; then
            cp "$RUNNER_TEMP/text.yml" "$wf"
          else
            echo "::warning::text edit of $wf did not match the yq edit; using the yq output"
            cp "$RUNNER_TEMP/want.yml" "$wf"
          fi
          git --no-pager diff

      - name: Cut the branch and open the setup PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "ci(release): configure $BRANCH for patch releases" \
            -m "Branch cut from $TAG. release-please on this branch bumps the patch only, cuts final versions and targets the pushed branch."

          # The branch points at the tagged commit itself; the settings land
          # through a PR like every other change to a release branch.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$BRANCH" -f "sha=$TAG_SHA" >/dev/null
          git push origin "HEAD:refs/heads/$SETUP_BRANCH"

          body="${RUNNER_TEMP}/body.md"
          {
            echo "Cut \`$BRANCH\` from \`$TAG\` (\`$TAG_SHA\`)."
            echo
            echo "Sets release-please on this branch to patch releases only:"
            echo "\`versioning: always-bump-patch\` and \`prerelease: false\` for package \`$PACKAGE_PATH\`,"
            echo "and \`$RELEASE_WORKFLOW\` runs on \`release/**\` with \`target-branch\` set to the pushed branch."
            echo "Other release-please packages, if any, are removed from this branch's config: the branch releases \`$PACKAGE_PATH\` only."
            echo
            echo "Merge this before any backport. Release branches are never deleted."
          } >"$body"
          gh pr create --base "$BRANCH" --head "$SETUP_BRANCH" \
            --title "ci(release): configure $BRANCH for patch releases" --body-file "$body"
