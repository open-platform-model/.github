name: Cascade publish
description: >-
  Verifies the plan the receiver's compute job uploaded, then mints the App
  token and pushes deps/cascade under a lease and opens, edits, recreates,
  closes or labels the cascade PR (workspace RELEASING.md, sections
  "Two-job split" and "One rolling PR per repo"). It never runs repo code.

# A composite action, not a job of cascade-receive.yml: a reusable-workflow
# job that declares `environment: cascade` sees the Environment's variables
# but not its secrets unless the caller passes `secrets: inherit` (sandbox
# cycle E1). So the caller owns the publish job: it needs the reusable
# Deps cascade job, declares `environment: cascade`, and passes the key in
# as an input. The plan is untrusted: compute ran repo code.

inputs:
  org-github-ref:
    description: The .github ref the scripts come from; only a sandbox repo may pass another than main
    required: false
    default: main
  labels-managed:
    description: The repo declares its labels itself (cli); publish only checks they exist
    required: false
    default: 'false'
  client-id:
    description: The App's client id, vars.CASCADE_APP_CLIENT_ID of the cascade Environment
    required: true
  private-key:
    description: The App key, secrets.CASCADE_APP_PRIVATE_KEY of the cascade Environment
    required: true

runs:
  using: composite
  steps:
    # Runs before anything is checked out from org-github-ref, so the ref
    # it guards cannot replace it.
    - name: Guard
      id: guard
      shell: bash
      env:
        INPUTS_REF: ${{ inputs.org-github-ref }}
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY%%/*}"
        name="${GITHUB_REPOSITORY#*/}"
        if [ "$owner/$name" != "$GITHUB_REPOSITORY" ] || [ "$owner" != open-platform-model ] \
          || ! [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          echo "::error::\`$GITHUB_REPOSITORY\` is not a repo of open-platform-model"
          exit 1
        fi
        if [ "$INPUTS_REF" != main ] && [[ ! $GITHUB_REPOSITORY =~ ^open-platform-model/cascade-sandbox- ]]; then
          echo "::error::org-github-ref may differ from main only in a sandbox repo"
          exit 1
        fi
        echo "::notice::repo $name"
        echo "repo=$name" >>"$GITHUB_OUTPUT"

    # The caller's if: already requires main; this holds even if a caller
    # forgets it. The cascade Environment refuses other refs as well.
    - name: Main only
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != refs/heads/main ]; then
          echo "::error::publish runs only on refs/heads/main, not $GITHUB_REF"
          exit 1
        fi

    - name: Check out org .github
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: open-platform-model/.github
        ref: ${{ inputs.org-github-ref }}
        path: org-github
        persist-credentials: false

    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: repo
        fetch-depth: 0
        persist-credentials: false

    - name: Download the plan
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cascade-plan
        path: ${{ runner.temp }}/cascade/plan

    - name: Verify the plan
      id: verify
      shell: bash
      env:
        CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        GH_TOKEN: ${{ github.token }}
        CASCADE_READ_TOKEN: ${{ github.token }}
      run: bash org-github/.github/scripts/cascade/wiring/receive-publish.sh verify

    # publish=false: a deps-cascade:hold appeared since compute.
    - name: Mint the App token
      id: mint
      if: steps.verify.outputs.publish == 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: open-platform-model
        repositories: ${{ steps.guard.outputs.repo }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    - name: Act
      if: steps.verify.outputs.publish == 'true'
      shell: bash
      env:
        CASCADE_REPO: ${{ steps.guard.outputs.repo }}
        CASCADE_LABELS_MANAGED: ${{ inputs.labels-managed }}
        GH_TOKEN: ${{ steps.mint.outputs.token }}
      run: bash org-github/.github/scripts/cascade/wiring/receive-publish.sh act
