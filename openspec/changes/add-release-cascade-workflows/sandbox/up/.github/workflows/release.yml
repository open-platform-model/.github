name: Release

# Publishes a release with up.tar.gz, then notifies cascade-sandbox-down
# through the shared cascade-notify action (sandbox cycle, Phase 3 wiring
# contract sections 11.3 and 13.1), pinned to a .github commit SHA because
# the cascade Environment here holds the production App key.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release tag, vX.Y.Z
        type: string
        required: true
      breaking:
        description: Write BREAKING CHANGES into the release notes
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ inputs.version }}
          BREAKING: ${{ inputs.breaking }}
        run: |
          set -euo pipefail
          if ! [[ $V =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be vX.Y.Z"
            exit 1
          fi
          notes="sandbox $V"
          if [ "$BREAKING" = true ]; then notes=$(printf '%s\n\n### BREAKING CHANGES\n\n* sandbox break\n' "$notes"); fi
          tar czf up.tar.gz README.md
          gh release create "$V" up.tar.gz --target main --title "$V" --notes "$notes"

  # The caller owns the cascade-Environment job and passes the key to the
  # composite action (a reusable workflow would not see the Environment
  # secret; sandbox cycle E1).
  notify-downstream:
    name: Notify downstream
    needs: release
    if: success() && vars.CASCADE_NOTIFY != 'off'
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Notify downstream
        uses: open-platform-model/.github/.github/actions/cascade-notify@a2950ce6d314618c108cfdf2e978133c2ab09f4a # feat/add-release-cascade-workflows
        with:
          tag: ${{ inputs.version }}
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
