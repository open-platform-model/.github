name: Probe env

# E1b: dispatched with --ref probe-env, the cascade Environment (main only)
# must refuse the notify job before any step runs. On main the job is
# skipped, so this file never notifies from main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: A published release tag
        type: string
        default: v0.1.0

permissions: {}

jobs:
  notify:
    name: Notify downstream
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: read
    uses: open-platform-model/.github/.github/workflows/cascade-notify.yml@feat/add-release-cascade-workflows
    with:
      tag: ${{ inputs.tag }}
      org-github-ref: feat/add-release-cascade-workflows
