name: Deps cascade

# The receiver caller (Phase 3 wiring contract section 5), at the .github
# branch under test, pinned to a commit SHA because this repo's cascade
# Environment holds the production App key. No schedule: the sandbox runs by dispatch only.

on:
  repository_dispatch:
    types: [upstream-released]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and show the diff in the job summary; push nothing
        type: boolean
        default: false
      gates_only:
        description: Evaluate and post the release-PR gates only (sent by Cascade gates)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.ref != 'refs/heads/main' && format('deps-cascade-{0}', github.ref) || (inputs.gates_only && 'deps-cascade-gates' || 'deps-cascade') }}
  cancel-in-progress: false

jobs:
  cascade:
    name: Deps cascade
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: open-platform-model/.github/.github/workflows/cascade-receive.yml@30a98c6f7c4b16971bc74076bcc432a468e433c7 # feat/add-release-cascade-workflows
    with:
      dry-run: ${{ inputs.dry_run == true || vars.CASCADE_DRY_RUN != 'false' }}
      gates-only: ${{ inputs.gates_only == true }}
      g2-mode: ${{ vars.CASCADE_G2_MODE || 'warn' }}
      g3-mode: ${{ vars.CASCADE_G3_MODE || 'warn' }}
      setup-go: false
      setup-cue: false
      org-github-ref: 30a98c6f7c4b16971bc74076bcc432a468e433c7

  # The caller owns the cascade-Environment job and passes the key to the
  # composite action (a reusable workflow would not see the Environment
  # secret; sandbox cycle E1). The stop switches are read here, not from
  # the reusable job that ran repo code.
  publish:
    name: Publish
    needs: cascade
    if: >-
      !cancelled()
      && needs.cascade.outputs.compute-ok == 'true'
      && needs.cascade.outputs.dry-run == 'false'
      && inputs.dry_run != true
      && vars.CASCADE_DRY_RUN == 'false'
      && github.ref == 'refs/heads/main'
      && contains(fromJSON('["push","recreate","close","conflict","too_long"]'), needs.cascade.outputs.action)
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Publish
        uses: open-platform-model/.github/.github/actions/cascade-publish@30a98c6f7c4b16971bc74076bcc432a468e433c7 # feat/add-release-cascade-workflows
        with:
          org-github-ref: 30a98c6f7c4b16971bc74076bcc432a468e433c7
          labels-managed: false
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
